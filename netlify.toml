[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify detects Next.js and installs its OpenNext adapter automatically.
# Configure Supabase values in the Netlify UI (build AND function scopes).

[[headers]]
  for = "/demo/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    X-Content-Type-Options = "nosniff"
